name: generate_crossword
description: "Generador de crucigramas y juego de palabras con Flutter (codelab flutter-word-puzzle)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  built_collection: ^5.1.1
  built_value: ^8.9.0
  characters: any
  flutter_riverpod: ^3.0.0
  intl: any
  material_ui: ^1.0.0
  riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  two_dimensional_scrollables: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  built_value_generator: ^8.9.0
  flutter_lints: any
  riverpod_generator: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/words.txt
